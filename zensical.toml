[project]
site_name = "devlog"
site_url = "https://maxbam.github.io/devlog/"
repo_url = "https://github.com/maxbam/devlog"
edit_uri = "edit/main/docs/"
strict = true

[project.theme]
name = "material"
variant = "modern"
features = [
  "navigation.top",
  "search.suggest",
  "content.action.edit"
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.blog]
